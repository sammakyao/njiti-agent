<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Njiti Chat</title>
  <meta name="description" content="Ask anything about caring for a baby born too early.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230b2a5b'/%3E%3Cpath d='M16 24s-7-4.3-7-9.2A3.8 3.8 0 0 1 16 12.6a3.8 3.8 0 0 1 7 2.2C23 19.7 16 24 16 24z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="chat-page">
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Njiti home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="var(--ink)"/><path d="M16 24s-7-4.3-7-9.2A3.8 3.8 0 0 1 16 12.6a3.8 3.8 0 0 1 7 2.2C23 19.7 16 24 16 24z" fill="var(--ink-text)"/></svg>
      Njiti
    </a>
    <nav class="menu">
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="menu-panel">Menu</button>
      <div class="menu-panel" id="menu-panel" hidden>
        <a href="/chat">New chat</a>
        <a href="/#danger-signs">Danger signs</a>
        <a href="/#about">About Njiti</a>
      </div>
    </nav>
  </header>

  <main class="thread" id="thread" aria-live="polite"></main>

  <div class="chat-dock">
    <form class="composer" id="chat-form">
      <label class="sr-only" for="chat-input">Ask anything</label>
      <textarea id="chat-input" rows="1" placeholder="Ask anything…" autofocus></textarea>
      <button class="icon-button mic-button" type="button" aria-label="Ask with your voice" hidden>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
      </button>
      <button class="send-button" type="submit" aria-label="Ask" disabled>
        <svg class="icon-send" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <svg class="icon-stop" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect width="18" height="18" rx="3" fill="currentColor"/></svg>
      </button>
    </form>
    <p class="dock-note">General information, not medical advice. In an emergency, go to the nearest health facility.</p>
  </div>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/chat.js"></script>
</body>
</html>
